            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

27"}, "id": "chunk:10", "label": "Request a Proposal", "shape": "dot", "title": "index: 10\u003cbr\u003ename: Request a Proposal\u003cbr\u003econtent: # Request a Proposal  \nBegin Your Retreat  \nTell us about your vision. We\u0027ll craft a tailored proposal and guide you to the perfect Alpine gathering.  \nReady to bring your team together? Contact us to discuss group size, dates, objectives, and any special requirements. We\u0027ll build a customized experience from the ground up.  \n**Request a Proposal**  \nShare your vision with us. Together, we\u0027ll design the retreat that captures your dreams and exceeds your expectations.  \nProject Lead\u003cbr\u003esection: Request a Proposal\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/contact.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:11", "label": "Wayfarer Retreat Planning", "shape": "dot", "title": "index: 11\u003cbr\u003ename: Wayfarer Retreat Planning\u003cbr\u003econtent: ### Wayfarer Retreat Planning  \nEmail\u003cbr\u003esection: Request a Proposal \u003e Wayfarer Retreat Planning\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/contact.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:12", "label": "hello@wayfarer-retreats.alpine", "shape": "dot", "title": "index: 12\u003cbr\u003ename: hello@wayfarer-retreats.alpine\u003cbr\u003econtent: ### hello@wayfarer-retreats.alpine  \nPhone\u003cbr\u003esection: Request a Proposal \u003e hello@wayfarer-retreats.alpine\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/contact.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:13", "label": "+39 258 256 1209", "shape": "dot", "title": "index: 13\u003cbr\u003ename: +39 258 256 1209\u003cbr\u003econtent: ### +39 258 256 1209  \n---\u003cbr\u003esection: Request a Proposal \u003e +39 258 256 1209\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/contact.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:14", "label": "Frequently Asked Questions", "shape": "dot", "title": "index: 14\u003cbr\u003ename: Frequently Asked Questions\u003cbr\u003econtent: # Frequently Asked Questions  \nWorking with Wayfarer  \nEverything you need to know about planning a retreat with us.  \nHave questions about customization, logistics, pricing, or capabilities? We\u0027ve compiled answers to common inquiries.  \n**Frequently Asked Questions**  \nQuestions answered. Doubts resolved. Every detail thoughtfully explained so you can plan with confidence.  \nHow far in advance should we book?  \nWe recommend 3\u20136 months for corporate events to ensure venue and activity availabili\u003cbr\u003esection: Frequently Asked Questions\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 2\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/faq.html"}, {"color": "#f97316", "font": {"color": "#111827"}, "id": "chunk:15", "label": "Frequently Asked Questions \u2014 Part 2", "shape": "dot", "title": "index: 15\u003cbr\u003ename: Frequently Asked Questions \u2014 Part 2\u003cbr\u003econtent: Can we bring our own speakers or facilitators?  \nAbsolutely. We host client-led sessions, guest speakers, and custom programming alongside our own activity roster. All technical and logistical support is provided.  \nWhat is your cancellation policy?  \nDeposits are non-refundable but can be applied to future dates. For full terms, we discuss cancellation conditions during your proposal consultation.  \nDo you handle transportation?  \nWe arrange ground transportation between local airports and venu\u003cbr\u003esection: Frequently Asked Questions\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 2\u003cbr\u003epart_count: 2\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/faq.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:16", "label": "Catering \u0026 Dining", "shape": "dot", "title": "index: 16\u003cbr\u003ename: Catering \u0026 Dining\u003cbr\u003econtent: # Catering \u0026 Dining  \nLocal \u0026 Seasonal  \nThoughtfully curated alpine cuisine designed to nourish and inspire connection.  \nWe believe great food brings people together. Our menus feature regional ingredients, artisanal producers, and flexible dining formats that suit corporate events, intimate celebrations, and large conferences.  \n**Catering \u0026 Dining**  \nTaste the essence of alpine hospitality. Our chefs craft menus that celebrate local traditions while nourishing your body and soul.  \nDietary \u003cbr\u003esection: Catering \u0026 Dining\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/food.html"}, {"color": "#16a34a", "font": {"color": "#111827"}, "id": "chunk:17", "label": "Vegetarian \u0026 Vegan", "shape": "dot", "title": "index: 17\u003cbr\u003ename: Vegetarian \u0026 Vegan\u003cbr\u003econtent: ## We accommodate all preferences  \n### Vegetarian \u0026 Vegan  \nFull menus available. We work with local farms for seasonal vegetables and plant-based specialties.\u003cbr\u003esection: Catering \u0026 Dining \u003e We accommodate all preferences \u003e Vegetarian \u0026 Vegan\u003cbr\u003eheading_level: 3\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/food.html"}, {"color": "#16a34a", "font": {"color": "#111827"}, "id": "chunk:18", "label": "Allergies \u0026 Intolerances", "shape": "dot", "title": "index: 18\u003cbr\u003ename: Allergies \u0026 Intolerances\u003cbr\u003econtent: ### Allergies \u0026 Intolerances  \nGluten-free, dairy-free, nut-free options prepared separately with full traceability.\u003cbr\u003esection: Catering \u0026 Dining \u003e We accommodate all preferences \u003e Allergies \u0026 Intolerances\u003cbr\u003eheading_level: 3\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/food.html"}, {"color": "#16a34a", "font": {"color": "#111827"}, "id": "chunk:19", "label": "Cultural \u0026 Religious", "shape": "dot", "title": "index: 19\u003cbr\u003ename: Cultural \u0026 Religious\u003cbr\u003econtent: ### Cultural \u0026 Religious  \nHalal, kosher, and other dietary requirements accommodated with advance notice.  \n[More questions? See FAQs](../pages/faq.html)  \n---\u003cbr\u003esection: Catering \u0026 Dining \u003e We accommodate all preferences \u003e Cultural \u0026 Religious\u003cbr\u003eheading_level: 3\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/food.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:20", "label": "Activities \u0026 Entertainment", "shape": "dot", "title": "index: 20\u003cbr\u003ename: Activities \u0026 Entertainment\u003cbr\u003econtent: # Activities \u0026 Entertainment  \nEngagement \u0026 Inspiration  \nDiverse experiences designed to energize teams and create lasting memories.  \nBeyond the boardroom. Our activity roster includes guided adventures, skill-building workshops, cultural experiences, and professional entertainment\u2014all customizable to your group\u0027s interests and schedule.  \n**Activities \u0026 Entertainment**  \nFrom sunrise hikes to fireside gatherings, each experience is designed to awaken your spirit and strengthen bonds that endu\u003cbr\u003esection: Activities \u0026 Entertainment\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/music.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:21", "label": "Guided Experiences", "shape": "dot", "title": "index: 21\u003cbr\u003ename: Guided Experiences\u003cbr\u003econtent: ### Guided Experiences  \nMountain hikes, forest walks, or photography expeditions led by local experts.\u003cbr\u003esection: Activities \u0026 Entertainment \u003e Guided Experiences\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/music.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:22", "label": "Workshops \u0026 Talks", "shape": "dot", "title": "index: 22\u003cbr\u003ename: Workshops \u0026 Talks\u003cbr\u003econtent: ### Workshops \u0026 Talks  \nLeadership sessions, creative skill-building, mindfulness practices, and curated guest speakers.\u003cbr\u003esection: Activities \u0026 Entertainment \u003e Workshops \u0026 Talks\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/music.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:23", "label": "Evening Entertainment", "shape": "dot", "title": "index: 23\u003cbr\u003ename: Evening Entertainment\u003cbr\u003econtent: ### Evening Entertainment  \nLive acoustic performances, storytelling by firelight, and local cultural showcases.  \n---\u003cbr\u003esection: Activities \u0026 Entertainment \u003e Evening Entertainment\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/music.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:24", "label": "There and Back Again", "shape": "dot", "title": "index: 24\u003cbr\u003ename: There and Back Again\u003cbr\u003econtent: # There and Back Again  \nMulti-day retreat  \nA fully customizable 3-day corporate retreat template showcasing our approach.  \nEvery itinerary is tailored to your group\u0027s objectives. This example shows how we structure time for team connection, skill-building, and celebration.  \n**There and Back Again**  \nEvery step of your journey is carefully mapped. From arrival to departure, we orchestrate each moment to deepen connection and inspire transformation.  \nDay 1, 14:00  \nArrivals and welcome recep\u003cbr\u003esection: There and Back Again\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/schedule.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:25", "label": "Our Venues", "shape": "dot", "title": "index: 25\u003cbr\u003ename: Our Venues\u003cbr\u003econtent: # Our Venues  \nCurated Alpine Locations  \nTwo distinct venues, each with unique character, capacity, and capabilities.  \nWe\u0027ve carefully selected two properties that balance luxury, accessibility, and authentic alpine character. Both offer full accommodation, extensive facilities, and year-round availability.  \n**Our Venues**  \nDiscover two distinctly magical spaces, each commanding its own presence in the mountains. Both are sanctuaries for meaningful gathering.  \nVenue option\u003cbr\u003esection: Our Venues\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/venue.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:26", "label": "Party Tree Hall and Grounds", "shape": "dot", "title": "index: 26\u003cbr\u003ename: Party Tree Hall and Grounds\u003cbr\u003econtent: ### Party Tree Hall and Grounds  \nA charming meadowside hall inspired by tales of fellowship and gathering. Nestled in rolling green fields, perfect for intimate celebrations where companionship and connection flourish.  \n* Capacity: 20\u201390 guests\n* 32 en-suite rooms\n* Full kitchen facilities\n* Indoor \u0026 outdoor spaces  \n[View details](../venues/partyfield.html)  \nVenue option\u003cbr\u003esection: Our Venues \u003e Party Tree Hall and Grounds\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/venue.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:27", "label": "The White Tower Upper Gallery", "shape": "dot", "title": "index: 27\u003cbr\u003ename: The White Tower Upper Gallery\u003cbr\u003econtent: ### The White Tower Upper Gallery  \nPerched high upon dramatic heights, this noble stronghold commands panoramic vistas. A grand citadel of stone and light, designed for those who seek to gather their most important allies.  \n* Capacity: 40\u2013150 guests\n* 55 guest rooms\n* Grand halls \u0026 breakout rooms\n* Terrace \u0026 panoramic views  \n[View details](../venues/minastirith.html)  \n---\u003cbr\u003esection: Our Venues \u003e The White Tower Upper Gallery\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/pages/venue.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:28", "label": "The White Tower Upper Gallery", "shape": "dot", "title": "index: 28\u003cbr\u003ename: The White Tower Upper Gallery\u003cbr\u003econtent: # The White Tower Upper Gallery  \nGrand Alpine Venue  \nA remarkable hilltop setting combining historic architecture, panoramic city views, and elevated terraces for memorable gatherings, formal events, and distinctive presentations.  \n**The White Tower Upper Gallery**  \nA fortress of hospitality above the city. Grand, dramatic, and framed by sweeping views, the White Tower offers an unforgettable setting for occasions that call for distinction.  \nPerched high above the city with commanding panor\u003cbr\u003esection: The White Tower Upper Gallery\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/venues/minastirith.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:29", "label": "Facilities", "shape": "dot", "title": "index: 29\u003cbr\u003ename: Facilities\u003cbr\u003econtent: ### Facilities  \n* Capacity: 40\u2013150 guests\n* 55 guest rooms (multiple configurations)\n* Elevator access to principal levels\n* Grand gallery and breakout spaces\n* Panoramic city and mountain views\n* Elevated terraces for receptions\n* Eastern balcony suited to acoustic performances\n* Multi-level catering and event setup\n* Historic architecture and distinctive interiors\n* Year-round operation  \n[Back to all venues](../pages/venue.html)  \n---\u003cbr\u003esection: The White Tower Upper Gallery \u003e Facilities\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/venues/minastirith.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:30", "label": "Party Tree Hall and Grounds", "shape": "dot", "title": "index: 30\u003cbr\u003ename: Party Tree Hall and Grounds\u003cbr\u003econtent: # Party Tree Hall and Grounds  \nIntimate Alpine Venue  \nA historic community gathering space in the heart of Michel Delving, combining rustic charm, open-air surroundings, and practical event facilities for relaxed, convivial celebrations.  \n**Party Tree Hall and Grounds**  \nWhere fellowship blooms beneath open skies. Warm, welcoming, and effortlessly convivial, the Party Tree Hall brings together shared tables, open meadows, and the spirit of the Shire.  \nNestled among the green of central Mich\u003cbr\u003esection: Party Tree Hall and Grounds\u003cbr\u003eheading_level: 1\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/venues/partyfield.html"}, {"color": "#2563eb", "font": {"color": "#111827"}, "id": "chunk:31", "label": "Facilities", "shape": "dot", "title": "index: 31\u003cbr\u003ename: Facilities\u003cbr\u003econtent: ### Facilities  \n* Capacity: 20\u201390 guests\n* 32 en-suite bedrooms\n* Fully accessible ground-level layout\n* Direct loading access for event setup\n* Indoor hall and adjoining courtyard\n* Dedicated food preparation and staging areas\n* Clear emergency access routes\n* Hiking trails from the property\n* Available year-round  \n[Back to all venues](../pages/venue.html)\u003cbr\u003esection: Party Tree Hall and Grounds \u003e Facilities\u003cbr\u003eheading_level: 2\u003cbr\u003epart_index: 1\u003cbr\u003epart_count: 1\u003cbr\u003esource: https://federicab03.github.io/ARGO_Usecase/venues/partyfield.html"}]);
