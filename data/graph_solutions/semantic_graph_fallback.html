            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

y. Shorter timelines may be possible depending on dates and scale.\\n\\nCan you accommodate groups of any size?\\n\\nOur venues range from 20\u2013150 guests. For larger groups or bespoke requirements, we can coordinate multiple venues or partner spaces.\\n\\nAre meals included in pricing?\\n\\nYes. All Wayfarer packages include full catering with customizable menus. Dietary preferences and restrictions are accommodated at no additional cost.\\n\\nWhat happens if weather is poor?\\n\\nBoth venues include fully equipped indoor spaces and weather backup plans. All outdoor activities have indoor alternatives that maintain program integrity.\\n\\nDo you provide accommodation?\\n\\nYes. Both venues include overnight accommodation. Room options range from standard doubles to suites. We also arrange transportation to/from airports or rail stations.\\n\\nWhat activities are available?\\n\\nOptions include guided hikes, storytelling sessions, workshops, live performances, cooking classes, and custom team-building experiences. We tailor the roster to your group\u0026#x27;s objectives.\\n\\nCan we bring our own speakers or facilitators?\\n\\nAbsolutely. We host client-led sessions, guest speakers, and custom programming alongside our own activity roster. All technical and logistical support is provided.\\n\\nWhat is your cancellation policy?\\n\\nDeposits are non-refundable but can be applied to future dates. For full terms, we discuss cancellation conditions during your proposal consultation.\\n\\nDo you handle transportation?\\n\\nWe arrange ground transportation between local airports and venues, plus any inter-venue or day-trip logistics your program requires.\\n\\n---\\n\\n# Catering \u0026amp; Dining\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/food.html\\n\\nLocal \u0026amp; Seasonal\\n\\nThoughtfully curated alpine cuisine designed to nourish and inspire connection.\\n\\nWe believe great food brings people together. Our menus feature regional ingredients, artisanal producers, and flexible dining formats that suit corporate events, intimate celebrations, and large conferences.\\n\\n**Catering \u0026amp; Dining**\\n\\nTaste the essence of alpine hospitality. Our chefs craft menus that celebrate local traditions while nourishing your body and soul.\\n\\nDietary Flexibility\\n\\n## We accommodate all preferences\\n\\n### Vegetarian \u0026amp; Vegan\\n\\nFull menus available. We work with local farms for seasonal vegetables and plant-based specialties.\\n\\n### Allergies \u0026amp; Intolerances\\n\\nGluten-free, dairy-free, nut-free options prepared separately with full traceability.\\n\\n### Cultural \u0026amp; Religious\\n\\nHalal, kosher, and other dietary requirements accommodated with advance notice.\\n\\n[More questions? See FAQs](../pages/faq.html)\\n\\n---\\n\\n# Activities \u0026amp; Entertainment\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/music.html\\n\\nEngagement \u0026amp; Inspiration\\n\\nDiverse experiences designed to energize teams and create lasting memories.\\n\\nBeyond the boardroom. Our activity roster includes guided adventures, skill-building workshops, cultural experiences, and professional entertainment\u2014all customizable to your group\u0026#x27;s interests and schedule.\\n\\n**Activities \u0026amp; Entertainment**\\n\\nFrom sunrise hikes to fireside gatherings, each experience is designed to awaken your spirit and strengthen bonds that endure.\\n\\n### Guided Experiences\\n\\nMountain hikes, forest walks, or photography expeditions led by local experts.\\n\\n### Workshops \u0026amp; Talks\\n\\nLeadership sessions, \u0026quot;"}, {"color": "#0891b2", "font": {"color": "#111827"}, "id": "4:92d408da-a954-4db3-99ec-9c6ab36cbc0f:3", "label": "Chunk 2", "shape": "dot", "title": "type: Chunk\u003cbr\u003eindex: 2\u003cbr\u003etext: \u0026quot;your spirit and strengthen bonds that endure.\\n\\n### Guided Experiences\\n\\nMountain hikes, forest walks, or photography expeditions led by local experts.\\n\\n### Workshops \u0026amp; Talks\\n\\nLeadership sessions, creative skill-building, mindfulness practices, and curated guest speakers.\\n\\n### Evening Entertainment\\n\\nLive acoustic performances, storytelling by firelight, and local cultural showcases.\\n\\n---\\n\\n# There and Back Again\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/schedule.html\\n\\nMulti-day retreat\\n\\nA fully customizable 3-day corporate retreat template showcasing our approach.\\n\\nEvery itinerary is tailored to your group\u0026#x27;s objectives. This example shows how we structure time for team connection, skill-building, and celebration.\\n\\n**There and Back Again**\\n\\nEvery step of your journey is carefully mapped. From arrival to departure, we orchestrate each moment to deepen connection and inspire transformation.\\n\\nDay 1, 14:00\\n\\nArrivals and welcome reception\\n\\nDay 1, 18:00\\n\\nDinner with local cuisine and wine pairing\\n\\nDay 2, 08:00\\n\\nGuided mountain hike or forest walk\\n\\nDay 2, 12:00\\n\\nLunch with guest speaker or facilitated workshop\\n\\nDay 2, 16:00\\n\\nBreakout sessions and activities by group\\n\\nDay 2, 19:30\\n\\nEvening entertainment and storytelling session\\n\\nDay 3, 09:00\\n\\nFinal workshop or strategic planning session\\n\\nDay 3, 12:00\\n\\nClosing celebration and farewell lunch\\n\\nDay 3, 14:00\\n\\nDepartures\\n\\n---\\n\\n# Our Venues\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/venue.html\\n\\nCurated Alpine Locations\\n\\nTwo distinct venues, each with unique character, capacity, and capabilities.\\n\\nWe\u0026#x27;ve carefully selected two properties that balance luxury, accessibility, and authentic alpine character. Both offer full accommodation, extensive facilities, and year-round availability.\\n\\n**Our Venues**\\n\\nDiscover two distinctly magical spaces, each commanding its own presence in the mountains. Both are sanctuaries for meaningful gathering.\\n\\nVenue option\\n\\n### Party Tree Hall and Grounds\\n\\nA charming meadowside hall inspired by tales of fellowship and gathering. Nestled in rolling green fields, perfect for intimate celebrations where companionship and connection flourish.\\n\\n* Capacity: 20\u201390 guests\\n* 32 en-suite rooms\\n* Full kitchen facilities\\n* Indoor \u0026amp; outdoor spaces\\n\\n[View details](../venues/partyfield.html)\\n\\nVenue option\\n\\n### The White Tower Upper Gallery\\n\\nPerched high upon dramatic heights, this noble stronghold commands panoramic vistas. A grand citadel of stone and light, designed for those who seek to gather their most important allies.\\n\\n* Capacity: 40\u2013150 guests\\n* 55 guest rooms\\n* Grand halls \u0026amp; breakout rooms\\n* Terrace \u0026amp; panoramic views\\n\\n[View details](../venues/minastirith.html)\\n\\n---\\n\\n# The White Tower Upper Gallery\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/venues/minastirith.html\\n\\nGrand Alpine Venue\\n\\nA remarkable hilltop setting combining historic architecture, panoramic city views, and elevated terraces for memorable gatherings, formal events, and distinctive presentations.\\n\\n**The White Tower Upper Gallery**\\n\\nA fortress of hospitality above the city. Grand, dramatic, and framed by sweeping views, the White Tower offers an unforgettable setting for occasions that call for distinction.\\n\\nPerched high above the city with commanding panoramic views, The White Tower Upper Gallery offers a truly distinctive backdrop for an Alpine evening. Its elevated terraces and eastern balcony provide natural sightlines across the city walls, making the setting particularly compelling for acoustic performances and outdoor moments. The venue\u0026#x27;s historic architecture creates an atmosphere of grandeur, while its multi-level layout brings a unique character to the flow of the evening. Guests should note that some areas are connected by a central spiral staircase and narrow internal corridors, and event logistics require coordination between levels.\\n\\n### Facilities\\n\\n* Capacity: 40\u2013150 guests\\n* 55 guest rooms (multiple configurations)\\n* Elevator access to principal levels\\n* Grand\u0026quot;"}, {"color": "#0891b2", "font": {"color": "#111827"}, "id": "4:92d408da-a954-4db3-99ec-9c6ab36cbc0f:4", "label": "Chunk 3", "shape": "dot", "title": "type: Chunk\u003cbr\u003eindex: 3\u003cbr\u003etext: \u0026quot; corridors, and event logistics require coordination between levels.\\n\\n### Facilities\\n\\n* Capacity: 40\u2013150 guests\\n* 55 guest rooms (multiple configurations)\\n* Elevator access to principal levels\\n* Grand gallery and breakout spaces\\n* Panoramic city and mountain views\\n* Elevated terraces for receptions\\n* Eastern balcony suited to acoustic performances\\n* Multi-level catering and event setup\\n* Historic architecture and distinctive interiors\\n* Year-round operation\\n\\n[Back to all venues](../pages/venue.html)\\n\\n---\\n\\n# Party Tree Hall and Grounds\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/venues/partyfield.html\\n\\nIntimate Alpine Venue\\n\\nA historic community gathering space in the heart of Michel Delving, combining rustic charm, open-air surroundings, and practical event facilities for relaxed, convivial celebrations.\\n\\n**Party Tree Hall and Grounds**\\n\\nWhere fellowship blooms beneath open skies. Warm, welcoming, and effortlessly convivial, the Party Tree Hall brings together shared tables, open meadows, and the spirit of the Shire.\\n\\nNestled among the green of central Michel Delving, the Party Tree Hall offers a welcoming setting for an evening of food, music, and fellowship. Its spacious ground-level reception area provides direct loading access for catering and music equipment, while the adjoining courtyard offers an open-air extension of the gathering with clear sightlines and easy guest circulation. Dedicated preparation and staging areas remain separate from attendee spaces, supporti ": {"color": "#111827"}, "id": "4:92d408da-a954-4db3-99ec-9c6ab36cbc0f:35", "label": "Chunk 0", "shape": "dot", "title": "type: Chunk\u003cbr\u003eindex: 0\u003cbr\u003etext: \u0026quot;# Immersive Alpine Gatherings\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/\\n\\nTimeless hospitality, modern excellence\\n\\nWayfarer creates unforgettable corporate retreats, executive offsites, and private celebrations in the Alps. We handle every detail\u2014from venue selection to multi-day programming.\\n\\n[View Sample Itinerary](pages/schedule.html)\\n[Explore Venues](pages/venue.html)\\n\\nCorporate retreatsExecutive offsitesPrivate celebrations\\n\\nOur Approach\\n**Immersive Retreats**\\n\\nCarefully curated experiences that blend mountain hospitality, meaningful connection, and lasting impact.\\n\\n**14+**Years of experience\\n\\n**2**Curated venues\\n\\n**20-150**Guest capacity range\\n\\nBespoke Design\\n\\n## Every gathering is uniquely yours\\n\\nWe craft experiences tailored to your group\u0026#x27;s goals and culture. Whether you\u0026#x27;re aligning teams, celebrating milestones, or exploring strategic futures, we design the retreat to fit your vision.\\n\\nOur curated venues, professional catering, and diverse activity offerings ensure each moment resonates with authenticity and purpose.\\n\\n[How we work](pages/faq.html)\\n\\nOur Services\\n\\n## Tailored experiences for every occasion\\n\\n### Catering \u0026amp; Dining\\n\\nLocal alpine cuisine, dietary flexibility, and intimate dining formats designed to foster connection.\\n\\n[Open page](pages/food.html)\\n\\n### Activities \u0026amp; Entertainment\\n\\nGuided hikes, storytelling sessions, workshops, live performances, and seasonal experiences.\\n\\n[Open page](pages/music.html)\\n\\n### Venue \u0026amp; Logistics\\n\\nTwo distinct Alpine venues with full accommodation, weather backup, and technical capabilities.\\n\\n[Open page](pages/venue.html)\\n\\n---\\n\\n# Immersive Alpine Gatherings\\n\\n ditional cost.\\n\\nWhat happens if weather is poor?\\n\\nBoth venues include fully equipped indoor spaces and weather backup plans. All outdoor activities have indoor alternatives that maintain program integrity.\\n\\nDo you provide accommodation?\\n\\nYes. Both venues include overnight accommodation. Room options range from standard doubles to suites. We also arrange transportation to/from airports or rail stations.\\n\\nWhat activities are available?\\n\\nOptions include guided hikes, storytelling sessions, workshops, live performances, cooking classes, and custom team-building experiences. We tailor the roster to your group\u0026#x27;s objectives.\\n\\nCan we bring our own speakers or facilitators?\\n\\nAbsolutely. We host client-led sessions, guest speakers, and custom programming alongside our own activity roster. All technical and logistical support is provided.\\n\\nWhat is your cancellation policy?\\n\\nDeposits are non-refundable but can be applied to future dates. For full terms, we discuss cancellation conditions during your proposal consultation.\\n\\nDo you handle transportation?\\n\\nWe arrange ground transportation between local airports and venues, plus any inter-venue or day-trip logistics your program requires.\\n\\n---\\n\\n# Catering \u0026amp; Dining\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/food.html\\n\\nLocal \u0026amp; Seasonal\\n\\nThoughtfully curated alpine cuisine designed to nourish and inspire connection.\\n\\nWe believe great food brings people together. Our menus feature regional ingredients, artisanal producers, and flexible dining formats that suit corporate events, intimate celebrations, and large conferences.\\n\\n**Catering \u0026amp; Dining**\\n\\nTaste the essence of alpine hospitality. Our chefs craft menus that celebrate local traditions while nourishing your body and soul.\\n\\nDietary Flexibility\\n\\n## We accommodate all preferences\\n\\n### Vegetarian \u0026amp; Vegan\\n\\nFull menus available. We work with local farms for seasonal vegetables and plant-based specialties.\\n\\n### Allergies \u0026amp; Intolerances\\n\\nGluten-free, dairy-free, nut-free options prepared separately with full traceability.\\n\\n### Cultural \u0026amp; Religious\\n\\nHalal, kosher, and other dietary requirements accommodated with advance notice.\\n\\n[More questions? See FAQs](../pages/faq.html)\\n\\n---\\n\\n# Activities \u0026amp; Entertainment\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/music.html\\n\\nEngagement \u0026amp; Inspiration\\n\\nDiverse experiences designed to energize teams and create lasting memories.\\n\\nBeyond the boardroom. Our activity roster includes guided adventures, skill-building workshops, cultural experiences, and professional entertainment\u2014all customizable to your group\u0026#x27;s interests and schedule.\\n\\n**Activities \u0026amp; Entertainment**\\n\\nFrom sunrise hikes to fireside gatherings, each experience is designed to awaken your spirit and strengthen bonds that endure.\\n\\n### Guided Experiences\\n\\nMountain hikes, forest walks, or photography expeditions led by local experts.\\n\\n### Workshops \u0026amp; Talks\\n\\nLeadership sessions, \u0026quot;"}, {"color": "#0891b2", "font": {"color": "#111827"}, "id": "4:92d408da-a954-4db3-99ec-9c6ab36cbc0f:37", "label": "Chunk 2", "shape": "dot", "title": "type: Chunk\u003cbr\u003eindex: 2\u003cbr\u003etext: \u0026quot;your spirit and strengthen bonds that endure.\\n\\n### Guided Experiences\\n\\nMountain hikes, forest walks, or photography expeditions led by local experts.\\n\\n### Workshops \u0026amp; Talks\\n\\nLeadership sessions, creative skill-building, mindfulness practices, and curated guest speakers.\\n\\n### Evening Entertainment\\n\\nLive acoustic performances, storytelling by firelight, and local cultural showcases.\\n\\n---\\n\\n# There and Back Again\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/pages/schedule.html\\n\\nMulti-day retreat\\n\\nA fully cu te Tower Upper Gallery\\n\\nPerched high upon dramatic heights, this noble stronghold commands panoramic vistas. A grand citadel of stone and light, designed for those who seek to gather their most important allies.\\n\\n* Capacity: 40\u2013150 guests\\n* 55 guest rooms\\n* Grand halls \u0026amp; breakout rooms\\n* Terrace \u0026amp; panoramic views\\n\\n[View details](../venues/minastirith.html)\\n\\n---\\n\\n# The White Tower Upper Gallery\\n\\nSource: https://federicab03.github.io/ARGO_Usecase/venues/minastirith.html\\n\\nGrand Alpine Venue\\n\\nA remarkable hilltop setting combining historic architecture, panoramic city views, and elevated terraces for memorable gatherings, formal events, and distinctive presentations.\\n\\n**The White Tower Upper Gallery**\\n\\nA fortress of hospitality above the city. Grand, dramatic, and framed by sweeping views, the White Tower offers an unforgettable setting for occasions that call for distinction.\\n\\nPerched high above the city with commanding panoramic views, The White Tower Upper Gallery offers a truly distinctive backdrop for an Alpine evening. Its elevated terraces and eastern balcony provide natural sightlines across the city walls, making the setting particularly compelling for acoustic performances and outdoor moments. The venue\u0026#x27;s historic architecture creates an atmosphere of grandeur, while its multi-level layout brings a unique character to the flow of the evening. Guests should note that some areas are connected by a central spiral staircase and narrow internal corridors, and event logistics require coordination between levels.\\n\\n### Facilities\\n\\n* Capacity: 40\u2013150 guests\\n* 55 guest rooms (multiple configurations)\\n* Elevator access to principal levels\\n* Grand\u0026quot;"}, {"color": "#0891b2", "font": {"color": "#111827"}, "id": "4:92d408da-a954-4db3-99ec-9c6ab36cbc0f:38", "label": "Chunk 3", "shape": "dot", "title": "type: Chunk\u003cbr\u003eindex: 3\u003cbr\u003etext: \u0026quot; c
